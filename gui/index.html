<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ecc-fe demo</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="container">
      <!-- 左：创建 Workspace 表单 -->
      <section class="panel">
        <h1>ECC Project Wizard</h1>

        <label for="project-root">项目根目录</label>
        <input id="project-root" value="" placeholder="留空使用后端默认目录" />

        <label for="project-name">项目名</label>
        <input id="project-name" value="demo_project" />

        <label for="top-module">Top Module</label>
        <input id="top-module" value="top" />

        <label for="clock">Clock</label>
        <input id="clock" value="clk" />

        <label for="filelist-path">Filelist (.f 文件路径)</label>
        <div class="input-row">
          <input id="filelist-path" placeholder="留空则不使用 filelist" />
          <button id="btn-examples" class="ghost small">示例 ▾</button>
        </div>
        <ul id="examples-dropdown" class="dropdown hidden"></ul>

        <div class="actions">
          <button id="btn-create">新建 Workspace</button>
          <button id="btn-run" class="ghost">运行全部 Flow</button>
        </div>
      </section>

      <!-- 右：日志输出 -->
      <section class="panel">
        <h2>执行日志</h2>
        <pre id="output">等待操作...</pre>
      </section>

      <!-- 下：Step 单步执行面板（创建 workspace 后显示） -->
      <section class="panel full-width hidden" id="steps-panel">
        <h2>单步执行</h2>
        <div id="steps-list" class="steps-list"></div>
      </section>
    </main>
    <script type="module" src="/src/views/ECCView.js"></script>
  </body>
</html>
