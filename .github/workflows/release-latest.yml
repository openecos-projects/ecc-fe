name: Release latest ECC-FE runtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecc-fe-release-latest
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      any: ${{ steps.select.outputs.any }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed release packages
        id: select
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/select-release-packages.sh "${BEFORE_SHA}" "${GITHUB_SHA}"

      - name: Test release package selection
        shell: bash
        run: bash .github/scripts/test-release-selection.sh

      - name: Check tracked waveform files
        shell: bash
        run: bash .github/scripts/check-no-tracked-waveforms.sh

      - name: Initialize CPU RTL submodules
        if: steps.select.outputs.cpu_rtl == 'true' || steps.select.outputs.runtime == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        if: steps.select.outputs.runtime == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        if: steps.select.outputs.runtime == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.12
          enable-cache: true

      - name: Test ECC-FE runtime
        if: steps.select.outputs.runtime == 'true'
        shell: bash
        run: |
          uv run --frozen --group test --python 3.11 pytest -q \
            test/test_allflow_builder.py \
            test/test_catalog_compatibility.py \
            test/test_catalog_contract.py \
            test/test_data_step.py \
            test/test_data_workspace.py \
            test/test_examples.py \
            test/test_frontend_detail_snapshot.py \
            test/test_rtl_review.py \
            test/test_runtime_server.py \
            test/test_runtime_stdio.py \
            test/test_runtime_transport.py \
            test/test_utility.py \
            test/test_workspace_application.py

      - name: Package selected resources
        if: steps.select.outputs.any == 'true'
        shell: bash
        env:
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          set -euo pipefail
          read -r -a packages <<< "${PACKAGES}"
          bash .github/scripts/package-release-assets.sh dist "${packages[@]}"

      - name: Check release archive contents
        if: steps.select.outputs.any == 'true'
        shell: bash
        env:
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          set -euo pipefail
          read -r -a packages <<< "${PACKAGES}"
          bash .github/scripts/check-release-archives.sh dist "${packages[@]}"

      - name: Smoke self-contained runtime without system Python
        if: steps.select.outputs.runtime == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runtime_root="${RUNNER_TEMP}/ecc-fe-runtime-smoke/ecc-fe-latest"
          mkdir -p "$(dirname "${runtime_root}")"
          tar -xzf dist/ecc-fe-latest.tar.gz -C "$(dirname "${runtime_root}")"

          response="${RUNNER_TEMP}/ecc-fe-runtime-response.txt"
          workspace="${RUNNER_TEMP}/ecc-fe-runtime-workspace"
          rtl="${GITHUB_WORKSPACE}/examples/cl3/cl3_verilog/cpu_top.sv"
          hello='{"jsonrpc":"2.0","id":1,"method":"rpc.hello","params":{"version":1}}'
          catalog='{"jsonrpc":"2.0","id":2,"method":"frontend.catalog","params":{}}'
          validate="{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"frontend.validate_config\",\"params\":{\"core_id\":\"custom-filelist\",\"test_suite_id\":\"smoke\",\"cpuRtlFiles\":[\"${rtl}\"]}}"
          create="{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"workspace.create\",\"params\":{\"directory\":\"${workspace}\",\"core_id\":\"custom-filelist\",\"test_suite_id\":\"smoke\",\"top_module\":\"cpu_top\",\"parameters\":{\"Design\":\"runtime-smoke\",\"Top module\":\"cpu_top\"},\"cpuRtlFiles\":[\"${rtl}\"]}}"
          prepare='{"jsonrpc":"2.0","id":5,"method":"flow.run_step","params":{"workspaceId":"workspace-1","step":"prepare","rerun":true}}'
          close='{"jsonrpc":"2.0","id":6,"method":"workspace.close","params":{"workspaceId":"workspace-1"}}'
          shutdown='{"jsonrpc":"2.0","id":7,"method":"rpc.shutdown","params":{}}'
          {
            printf 'Content-Length: %s\r\n\r\n%s' "${#hello}" "${hello}"
            printf 'Content-Length: %s\r\n\r\n%s' "${#catalog}" "${catalog}"
            printf 'Content-Length: %s\r\n\r\n%s' "${#validate}" "${validate}"
            printf 'Content-Length: %s\r\n\r\n%s' "${#create}" "${create}"
            printf 'Content-Length: %s\r\n\r\n%s' "${#prepare}" "${prepare}"
            printf 'Content-Length: %s\r\n\r\n%s' "${#close}" "${close}"
            printf 'Content-Length: %s\r\n\r\n%s' "${#shutdown}" "${shutdown}"
          } \
            | env -i \
                HOME="${HOME}" \
                TMPDIR="${RUNNER_TEMP}" \
                PATH=/nonexistent \
                ECOS_FE_COMPILER_ROOT="${runtime_root}" \
                "${runtime_root}/bin/ecc-fe" rpc serve --stdio \
            > "${response}"
          response_lines="${RUNNER_TEMP}/ecc-fe-runtime-response-lines.txt"
          tr '\r' '\n' < "${response}" > "${response_lines}"
          grep -F '"eccFeVersion"' "${response_lines}"
          grep -F '"frontend.catalog"' "${response_lines}"
          grep -F '"cores"' "${response_lines}"
          grep -F '"id":3,"result":{"ok":true,' "${response_lines}"
          grep -F '"id":4,"result":{"directory":' "${response_lines}" | grep -F '"workspaceId":"workspace-1"'
          grep -F '"id":5,"result":{"step":"prepare","state":"Success"' "${response_lines}"
          grep -F '"id":6,"result":{"ok":true}' "${response_lines}"
          if grep -F '"error"' "${response_lines}"; then
            exit 1
          fi

      - name: Upload runtime payload
        if: steps.select.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-runtime
          path: |
            dist/ecc-fe-latest.tar.gz
            dist/ecc-fe-latest.tar.gz.sha256
            dist/ecc-fe-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload SoC payload
        if: steps.select.outputs.soc == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-soc
          path: |
            dist/ecc-fe-soc-ysyx-am-latest.tar.gz
            dist/ecc-fe-soc-ysyx-am-latest.tar.gz.sha256
            dist/ecc-fe-soc-ysyx-am-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload CPU RTL payload
        if: steps.select.outputs.cpu_rtl == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-cpu-rtl
          path: |
            dist/ecc-fe-cpu-rtl-latest.tar.gz
            dist/ecc-fe-cpu-rtl-latest.tar.gz.sha256
            dist/ecc-fe-cpu-rtl-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload difftest reference payload
        if: steps.select.outputs.difftest_ref == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-difftest-ref
          path: |
            dist/ecc-fe-difftest-ref-latest.tar.gz
            dist/ecc-fe-difftest-ref-latest.tar.gz.sha256
            dist/ecc-fe-difftest-ref-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload examples payload
        if: steps.select.outputs.examples == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-examples
          path: |
            dist/ecc-fe-examples-latest.tar.gz
            dist/ecc-fe-examples-latest.tar.gz.sha256
            dist/ecc-fe-examples-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    if: needs.package.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.package.outputs.matrix) }}
    steps:
      - name: Download release payloads
        uses: actions/download-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-${{ matrix.package }}
          path: dist

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "${PACKAGE}" in
            runtime)
              tag="ecc-fe-latest"
              title="ECC-FE latest"
              archive="ecc-fe-latest.tar.gz"
              metadata="ecc-fe-latest.metadata.json"
              description="Mutable latest ECC-FE runtime package"
              ;;
            soc)
              tag="ecc-fe-soc-ysyx-am-latest"
              title="ECC-FE YSYX AM SoC Harness latest"
              archive="ecc-fe-soc-ysyx-am-latest.tar.gz"
              metadata="ecc-fe-soc-ysyx-am-latest.metadata.json"
              description="Mutable latest ECC-FE YSYX AM SoC harness package"
              ;;
            cpu-rtl)
              tag="ecc-fe-cpu-rtl-latest"
              title="ECC-FE CPU RTL latest"
              archive="ecc-fe-cpu-rtl-latest.tar.gz"
              metadata="ecc-fe-cpu-rtl-latest.metadata.json"
              description="Mutable latest ECC-FE CPU RTL package"
              ;;
            difftest-ref)
              tag="ecc-fe-difftest-ref-latest"
              title="ECC-FE Difftest Reference latest"
              archive="ecc-fe-difftest-ref-latest.tar.gz"
              metadata="ecc-fe-difftest-ref-latest.metadata.json"
              description="Mutable latest ECC-FE difftest reference package"
              ;;
            examples)
              tag="ecc-fe-examples-latest"
              title="ECC-FE Examples latest"
              archive="ecc-fe-examples-latest.tar.gz"
              metadata="ecc-fe-examples-latest.metadata.json"
              description="Mutable latest ECC-FE examples package"
              ;;
            *)
              echo "Unknown release package: ${PACKAGE}" >&2
              exit 2
              ;;
          esac
          {
            printf 'tag=%s\n' "${tag}"
            printf 'title=%s\n' "${title}"
            printf 'archive=%s\n' "${archive}"
            printf 'metadata=%s\n' "${metadata}"
            printf 'description=%s\n' "${description}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create resource release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ECOS_RELEASE_APP_ID }}
          private-key: ${{ secrets.ECOS_RELEASE_APP_PRIVATE_KEY }}
          owner: openecos-projects
          repositories: ecos-resource-assets

      - name: Publish latest resource archive
        uses: softprops/action-gh-release@v2
        with:
          repository: openecos-projects/ecos-resource-assets
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body: |
            ${{ steps.release.outputs.description }} generated from openecos-projects/ecc-fe `main` at `${{ github.sha }}`.
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            dist/${{ steps.release.outputs.archive }}
            dist/${{ steps.release.outputs.archive }}.sha256

      - name: Publish release metadata last
        uses: softprops/action-gh-release@v2
        with:
          repository: openecos-projects/ecos-resource-assets
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body: |
            ${{ steps.release.outputs.description }} generated from openecos-projects/ecc-fe `main` at `${{ github.sha }}`.
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            dist/${{ steps.release.outputs.metadata }}
