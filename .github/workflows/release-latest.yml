name: Release latest ECC-FE runtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecc-fe-release-latest
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      any: ${{ steps.select.outputs.any }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed release packages
        id: select
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/select-release-packages.sh "${BEFORE_SHA}" "${GITHUB_SHA}"

      - name: Test release package selection
        shell: bash
        run: bash .github/scripts/test-release-selection.sh

      - name: Check tracked waveform files
        shell: bash
        run: bash .github/scripts/check-no-tracked-waveforms.sh

      - name: Initialize CPU RTL submodules
        if: steps.select.outputs.cpu_rtl == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Package selected resources
        if: steps.select.outputs.any == 'true'
        shell: bash
        env:
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          set -euo pipefail
          read -r -a packages <<< "${PACKAGES}"
          bash .github/scripts/package-release-assets.sh dist "${packages[@]}"

      - name: Check release archive contents
        if: steps.select.outputs.any == 'true'
        shell: bash
        env:
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          set -euo pipefail
          read -r -a packages <<< "${PACKAGES}"
          bash .github/scripts/check-release-archives.sh dist "${packages[@]}"

      - name: Upload runtime payload
        if: steps.select.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-runtime
          path: |
            dist/ecc-fe-latest.tar.gz
            dist/ecc-fe-latest.tar.gz.sha256
            dist/ecc-fe-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload SoC payload
        if: steps.select.outputs.soc == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-soc
          path: |
            dist/ecc-fe-soc-ysyx-am-latest.tar.gz
            dist/ecc-fe-soc-ysyx-am-latest.tar.gz.sha256
            dist/ecc-fe-soc-ysyx-am-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload CPU RTL payload
        if: steps.select.outputs.cpu_rtl == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-cpu-rtl
          path: |
            dist/ecc-fe-cpu-rtl-latest.tar.gz
            dist/ecc-fe-cpu-rtl-latest.tar.gz.sha256
            dist/ecc-fe-cpu-rtl-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload difftest reference payload
        if: steps.select.outputs.difftest_ref == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-difftest-ref
          path: |
            dist/ecc-fe-difftest-ref-latest.tar.gz
            dist/ecc-fe-difftest-ref-latest.tar.gz.sha256
            dist/ecc-fe-difftest-ref-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload examples payload
        if: steps.select.outputs.examples == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-examples
          path: |
            dist/ecc-fe-examples-latest.tar.gz
            dist/ecc-fe-examples-latest.tar.gz.sha256
            dist/ecc-fe-examples-latest.metadata.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    if: needs.package.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.package.outputs.matrix) }}
    steps:
      - name: Download release payloads
        uses: actions/download-artifact@v4
        with:
          name: ecc-fe-release-${{ github.sha }}-${{ matrix.package }}
          path: dist

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          case "${PACKAGE}" in
            runtime)
              tag="ecc-fe-latest"
              title="ECC-FE latest"
              archive="ecc-fe-latest.tar.gz"
              metadata="ecc-fe-latest.metadata.json"
              description="Mutable latest ECC-FE runtime package"
              ;;
            soc)
              tag="ecc-fe-soc-ysyx-am-latest"
              title="ECC-FE YSYX AM SoC Harness latest"
              archive="ecc-fe-soc-ysyx-am-latest.tar.gz"
              metadata="ecc-fe-soc-ysyx-am-latest.metadata.json"
              description="Mutable latest ECC-FE YSYX AM SoC harness package"
              ;;
            cpu-rtl)
              tag="ecc-fe-cpu-rtl-latest"
              title="ECC-FE CPU RTL latest"
              archive="ecc-fe-cpu-rtl-latest.tar.gz"
              metadata="ecc-fe-cpu-rtl-latest.metadata.json"
              description="Mutable latest ECC-FE CPU RTL package"
              ;;
            difftest-ref)
              tag="ecc-fe-difftest-ref-latest"
              title="ECC-FE Difftest Reference latest"
              archive="ecc-fe-difftest-ref-latest.tar.gz"
              metadata="ecc-fe-difftest-ref-latest.metadata.json"
              description="Mutable latest ECC-FE difftest reference package"
              ;;
            examples)
              tag="ecc-fe-examples-latest"
              title="ECC-FE Examples latest"
              archive="ecc-fe-examples-latest.tar.gz"
              metadata="ecc-fe-examples-latest.metadata.json"
              description="Mutable latest ECC-FE examples package"
              ;;
            *)
              echo "Unknown release package: ${PACKAGE}" >&2
              exit 2
              ;;
          esac
          {
            printf 'tag=%s\n' "${tag}"
            printf 'title=%s\n' "${title}"
            printf 'archive=%s\n' "${archive}"
            printf 'metadata=%s\n' "${metadata}"
            printf 'description=%s\n' "${description}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create resource release token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ECOS_RELEASE_APP_ID }}
          private-key: ${{ secrets.ECOS_RELEASE_APP_PRIVATE_KEY }}
          owner: openecos-projects
          repositories: ecos-resource-assets

      - name: Publish latest resource archive
        uses: softprops/action-gh-release@v2
        with:
          repository: openecos-projects/ecos-resource-assets
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body: |
            ${{ steps.release.outputs.description }} generated from openecos-projects/ecc-fe `main` at `${{ github.sha }}`.
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            dist/${{ steps.release.outputs.archive }}
            dist/${{ steps.release.outputs.archive }}.sha256

      - name: Publish release metadata last
        uses: softprops/action-gh-release@v2
        with:
          repository: openecos-projects/ecos-resource-assets
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body: |
            ${{ steps.release.outputs.description }} generated from openecos-projects/ecc-fe `main` at `${{ github.sha }}`.
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            dist/${{ steps.release.outputs.metadata }}
