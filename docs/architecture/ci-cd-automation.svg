<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ECC-FE cross-repository CI and CD automation</title>
  <desc id="desc">A push to the ECC-FE main branch selectively packages resources and publishes mutable release assets. The registry periodically refreshes locks from release metadata, validates and deploys the registry to GitHub Pages. ECOS Studio consumes the Pages registry and assets through its Resource Manager.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#53636f"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3489a5"/>
    </marker>
    <style>
      .canvas { fill: #f5f7f8; }
      .header { fill: #17242d; }
      .lane { fill: #ffffff; stroke: #c8d3da; stroke-width: 2; }
      .blue { fill: #eaf5f8; stroke: #55a2ba; stroke-width: 2; }
      .green { fill: #eaf6f1; stroke: #48a484; stroke-width: 2; }
      .amber { fill: #fff6dd; stroke: #d2a142; stroke-width: 2; }
      .coral { fill: #fff0ed; stroke: #df7566; stroke-width: 2; }
      .violet { fill: #f3eff9; stroke: #8b72b3; stroke-width: 2; }
      .slate { fill: #edf1f3; stroke: #98a7b1; stroke-width: 2; }
      .title { font: 700 36px Inter, "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font: 400 17px Inter, "Segoe UI", Arial, sans-serif; fill: #cbd6dc; letter-spacing: 0; }
      .repo { font: 700 17px Inter, "Segoe UI", Arial, sans-serif; fill: #17242d; letter-spacing: 0; }
      .owner { font: 600 12.5px "SFMono-Regular", Consolas, monospace; fill: #52616d; letter-spacing: 0; }
      .heading { font: 700 16px Inter, "Segoe UI", Arial, sans-serif; fill: #17242d; letter-spacing: 0; }
      .body { font: 400 13px Inter, "Segoe UI", Arial, sans-serif; fill: #52616d; letter-spacing: 0; }
      .small { font: 400 12px Inter, "Segoe UI", Arial, sans-serif; fill: #647480; letter-spacing: 0; }
      .code { font: 600 12px "SFMono-Regular", Consolas, monospace; fill: #304754; letter-spacing: 0; }
      .line { fill: none; stroke: #53636f; stroke-width: 2.5; marker-end: url(#arrow); }
      .network { fill: none; stroke: #3489a5; stroke-width: 3; stroke-dasharray: 9 6; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1120"/>
  <rect class="header" width="1600" height="118"/>
  <text class="title" x="64" y="57">Cross-Repository CI / CD Automation</text>
  <text class="subtitle" x="64" y="87">Source changes become verified release bytes, locked registry records, a Pages endpoint and GUI updates</text>

  <rect class="lane" x="40" y="150" width="350" height="894" rx="8"/>
  <rect x="40" y="150" width="350" height="78" rx="8" fill="#eaf5f8" stroke="#55a2ba" stroke-width="2"/>
  <text class="repo" x="64" y="183">ECC-FE Source</text>
  <text class="owner" x="64" y="208">openecos-projects/ecc-fe</text>

  <rect class="lane" x="430" y="150" width="350" height="894" rx="8"/>
  <rect x="430" y="150" width="350" height="78" rx="8" fill="#fff0ed" stroke="#df7566" stroke-width="2"/>
  <text class="repo" x="454" y="183">Release Asset Store</text>
  <text class="owner" x="454" y="208">openecos-projects/ecos-resource-assets</text>

  <rect class="lane" x="820" y="150" width="350" height="894" rx="8"/>
  <rect x="820" y="150" width="350" height="78" rx="8" fill="#fff6dd" stroke="#d2a142" stroke-width="2"/>
  <text class="repo" x="844" y="183">Resource Registry</text>
  <text class="owner" x="844" y="208">Emin017/ecos-registry</text>

  <rect class="lane" x="1210" y="150" width="350" height="894" rx="8"/>
  <rect x="1210" y="150" width="350" height="78" rx="8" fill="#eaf6f1" stroke="#48a484" stroke-width="2"/>
  <text class="repo" x="1234" y="183">Desktop Application</text>
  <text class="owner" x="1234" y="208">openecos-projects/ecos-studio</text>

  <rect class="blue" x="70" y="268" width="290" height="96" rx="8"/>
  <text class="heading" x="94" y="300">Trigger</text>
  <text class="body" x="94" y="327">Push to main or workflow_dispatch</text>
  <text class="small" x="94" y="349">Manual dispatch forces all packages</text>

  <rect class="slate" x="70" y="402" width="290" height="116" rx="8"/>
  <text class="heading" x="94" y="434">Select Changed Payloads</text>
  <text class="body" x="94" y="461">runtime / soc / cpu-rtl</text>
  <text class="body" x="94" y="484">difftest-ref / examples</text>
  <text class="small" x="94" y="506">Path classifier minimizes rebuilds</text>

  <rect class="amber" x="70" y="556" width="290" height="146" rx="8"/>
  <text class="heading" x="94" y="588">Test and Package</text>
  <text class="body" x="94" y="615">Runtime pytest suite</text>
  <text class="body" x="94" y="638">Deterministic tar.gz + metadata</text>
  <text class="body" x="94" y="661">Archive boundary assertions</text>
  <text class="small" x="94" y="685">Recursive CPU submodules as needed</text>

  <rect class="green" x="70" y="740" width="290" height="116" rx="8"/>
  <text class="heading" x="94" y="772">Self-Contained Smoke</text>
  <text class="body" x="94" y="799">PATH=/nonexistent</text>
  <text class="body" x="94" y="822">RPC hello, catalog, create, prepare</text>
  <text class="small" x="94" y="844">Proves no system Python dependency</text>

  <rect class="coral" x="70" y="894" width="290" height="116" rx="8"/>
  <text class="heading" x="94" y="926">Publish Matrix</text>
  <text class="body" x="94" y="953">GitHub App token</text>
  <text class="body" x="94" y="976">Overwrite mutable latest releases</text>
  <text class="small" x="94" y="998">Metadata is uploaded last</text>

  <path class="line" d="M215 364 V394"/>
  <path class="line" d="M215 518 V548"/>
  <path class="line" d="M215 702 V732"/>
  <path class="line" d="M215 856 V886"/>

  <rect class="coral" x="460" y="370" width="290" height="214" rx="8"/>
  <text class="heading" x="484" y="404">Mutable Release Tags</text>
  <text class="code" x="484" y="434">ecc-fe-latest</text>
  <text class="code" x="484" y="462">ecc-fe-cpu-rtl-latest</text>
  <text class="code" x="484" y="490">ecc-fe-soc-ysyx-am-latest</text>
  <text class="code" x="484" y="518">ecc-fe-difftest-ref-latest</text>
  <text class="code" x="484" y="546">ecc-fe-examples-latest</text>
  <text class="small" x="484" y="570">Archive, SHA sidecar, metadata JSON</text>

  <path class="network" d="M360 952 H414 V477 H452"/>

  <rect class="amber" x="850" y="268" width="290" height="116" rx="8"/>
  <text class="heading" x="874" y="300">Refresh Registry Locks</text>
  <text class="body" x="874" y="327">Daily at 03:17 UTC or manual</text>
  <text class="body" x="874" y="350">Fetch release metadata SHA + size</text>
  <text class="small" x="874" y="372">Static URLs remain unchanged</text>

  <path class="network" d="M750 477 H794 V326 H842"/>

  <rect class="slate" x="850" y="422" width="290" height="116" rx="8"/>
  <text class="heading" x="874" y="454">Validate and Commit</text>
  <text class="body" x="874" y="481">Schema, locks and live URLs</text>
  <text class="body" x="874" y="504">Bot commit only when locks change</text>
  <text class="small" x="874" y="526">Serialized by workflow concurrency</text>

  <rect class="blue" x="850" y="576" width="290" height="132" rx="8"/>
  <text class="heading" x="874" y="608">Deploy Registry Pages</text>
  <text class="body" x="874" y="635">Main push or explicit dispatch</text>
  <text class="body" x="874" y="658">Validate, build _site, deploy</text>
  <text class="code" x="874" y="686">tool-registry.json</text>

  <path class="line" d="M995 384 V414"/>
  <path class="line" d="M995 538 V568"/>

  <rect class="green" x="850" y="746" width="290" height="110" rx="8"/>
  <text class="heading" x="874" y="778">Public Registry Endpoint</text>
  <text class="code" x="874" y="806">emin017.github.io/</text>
  <text class="code" x="874" y="830">ecos-registry/tool-registry.json</text>
  <path class="line" d="M995 708 V738"/>

  <rect class="green" x="1240" y="268" width="290" height="132" rx="8"/>
  <text class="heading" x="1264" y="300">Resource Manager Refresh</text>
  <text class="body" x="1264" y="327">Fetch Pages registry</text>
  <text class="body" x="1264" y="350">Fetch release metadata</text>
  <text class="small" x="1264" y="376">Show update only after lock match</text>

  <path class="network" d="M1140 801 H1184 V334 H1232"/>
  <path class="network" d="M750 530 H794 V242 H1184 V364 H1232"/>

  <rect class="blue" x="1240" y="438" width="290" height="144" rx="8"/>
  <text class="heading" x="1264" y="470">Install or Update</text>
  <text class="body" x="1264" y="497">Resolve requires recursively</text>
  <text class="body" x="1264" y="520">Download locked release bytes</text>
  <text class="body" x="1264" y="543">Verify, health-check, atomic swap</text>
  <text class="small" x="1264" y="567">Manifest commit or rollback</text>
  <path class="line" d="M1385 400 V430"/>

  <rect class="amber" x="1240" y="620" width="290" height="132" rx="8"/>
  <text class="heading" x="1264" y="652">Compose Runtime</text>
  <text class="body" x="1264" y="679">Inject tool and resource roots</text>
  <text class="body" x="1264" y="702">Launch ECC-FE JSON-RPC sidecar</text>
  <text class="small" x="1264" y="728">Healthy active resources only</text>
  <path class="line" d="M1385 582 V612"/>

  <rect class="violet" x="1240" y="790" width="290" height="178" rx="8"/>
  <text class="heading" x="1264" y="822">Independent Studio CI</text>
  <text class="body" x="1264" y="849">GUI typecheck, lint, format</text>
  <text class="body" x="1264" y="872">Renderer and Electron tests</text>
  <text class="body" x="1264" y="895">AppImage build on relevant changes</text>
  <line x1="1264" y1="918" x2="1506" y2="918" stroke="#d6cae7"/>
  <text class="small" x="1264" y="943">Resource publication does not rebuild</text>
  <text class="small" x="1264" y="962">the desktop application.</text>

  <rect class="slate" x="430" y="884" width="740" height="126" rx="8"/>
  <text class="heading" x="454" y="918">Why the Registry Layer Exists</text>
  <text class="body" x="454" y="947">Mutable release tags provide current bytes; the registry freezes the approved SHA256 and size.</text>
  <text class="body" x="454" y="974">GitHub Pages then gives every desktop client one cacheable, validated catalog endpoint.</text>
  <text class="small" x="800" y="1082" text-anchor="middle">Automation crosses repositories through release metadata and explicit workflow triggers, not through source submodule updates.</text>
</svg>
